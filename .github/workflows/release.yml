name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, like v1.2.0
        required: true
        type: string
      move-major:
        description: Move the major tag (like v1) to this release
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$VERSION isn't a version like v1.2.0 or v1.2.0-beta.1"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION is released already"
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: dist is up to date
        run: |
          pnpm build
          git diff --exit-code -- dist || { echo "::error::dist/ on main is out of date"; exit 1; }

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$VERSION" --verify-tag --generate-notes $prerelease

      - name: Move the major tag
        if: inputs.move-major && !contains(inputs.version, '-')
        env:
          VERSION: ${{ inputs.version }}
        run: |
          major="${VERSION%%.*}"
          git tag -f "$major"
          git push -f origin "refs/tags/$major"
          echo "$major now points at $VERSION"
