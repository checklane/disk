version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    versioning-strategy: increase
    ignore:
      # The runner runs the action on Node 24 (action.yml): its types stay on
      # 24, so nothing newer slips in. A new major goes with a new runs.using.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      tools:
        dependency-type: development
        update-types: [minor, patch]
