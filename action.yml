name: Checklane disk
description: Keep a directory between runs of your jobs on Checklane, on a disk that is mounted in place, with nothing to download or unpack.
author: Checklane
branding:
  icon: hard-drive
  color: green
inputs:
  key:
    description: Names the disk. Jobs of the repository that use the same key get the same disk.
    required: true
  path:
    description: The directory the disk is mounted at, or up to 16 of them, one per line, all on the one disk. ~ is your home directory; a relative path is relative to the workspace.
    required: true
  commit:
    description: "When what the job leaves on the disk is kept for the next jobs, after a successful run on the default branch: true always, false never (the job reads the disk and its changes are thrown away), on-change when the job wrote to the disk, if-missing when the disk was empty for its paths."
    required: false
    default: "true"
runs:
  using: node24
  main: dist/main.js
  post: dist/post.js
